<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="EduTrack - Attendance Management System for Educational Institutions"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    
    <!-- Tailwind Configuration -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'on-surface': '#1f2937',
              'on-surface-variant': '#6b7280',
              'primary': '#4f46e5',
              'primary-container': '#eef2ff',
              'secondary': '#7c3aed',
              'secondary-container': '#ede9fe',
              'tertiary': '#0891b2',
              'tertiary-container': '#cffafe',
              'surface-container-low': '#f9fafb',
              'outline': '#d1d5db',
              'outline-variant': '#e5e7eb',
              'error': '#ef4444',
              'error-container': '#fee2e2',
            },
            fontFamily: {
              'sans': ['Inter', 'sans-serif'],
              'jakarta': ['Plus Jakarta Sans', 'sans-serif'],
            },
          },
        },
      }
    </script>
    
    <style>
      /* Glass morphism card styling */
      .glass-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
      }

      /* Mesh gradient background */
      .mesh-gradient {
        background-color: #f8f9ff;
        background-image: 
            radial-gradient(at 0% 0%, hsla(220,100%,90%,1) 0px, transparent 50%),
            radial-gradient(at 100% 0%, hsla(230,100%,85%,1) 0px, transparent 50%),
            radial-gradient(at 100% 100%, hsla(200,100%,90%,1) 0px, transparent 50%),
            radial-gradient(at 0% 100%, hsla(210,100%,92%,1) 0px, transparent 50%),
            radial-gradient(at 50% 50%, hsla(225,100%,95%,1) 0px, transparent 50%);
      }

      /* Mesh background gradient */
      .mesh-bg {
        background: linear-gradient(135deg, #00288e 0%, #4648d4 100%);
      }

      /* Material Symbols Icon Font */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        display: inline-block;
        line-height: 1;
        text-transform: none;
        letter-spacing: normal;
        word-wrap: normal;
        white-space: nowrap;
        direction: ltr;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
    </style>
    
    <title>EduTrack - Attendance Management System</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

  </body>
</html>
